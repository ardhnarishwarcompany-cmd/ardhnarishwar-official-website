<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Recruitment 3D Icon</title>
  <defs>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee7fb"/>
      <stop offset="100%" stop-color="#b99bd5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c5ee"/>
      <stop offset="100%" stop-color="#80609e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a6"/>
      <stop offset="45%" stop-color="#d99a42"/>
      <stop offset="100%" stop-color="#8d5423"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="800" height="800" fill="none"/>
  
  <ellipse cx="400" cy="650" rx="190" ry="35" fill="#80609e" opacity=".2"/>
  <g filter="url(#shadow)">
    <circle cx="400" cy="245" r="82" fill="url(#purple)" stroke="#f4eaff" stroke-width="6"/>
    <path d="M285 570 C285 420 325 355 400 355 C475 355 515 420 515 570 Z" fill="url(#purple)" stroke="#f4eaff" stroke-width="6"/>
    <circle cx="400" cy="245" r="22" fill="#ffe1a1"/>
  </g>
  <g fill="none" stroke="#d99a42" stroke-width="5">
    <circle cx="180" cy="270" r="35"/><circle cx="620" cy="270" r="35"/>
    <path d="M215 270 H318 M482 270 H585"/>
  </g>
  <circle cx="180" cy="270" r="12" fill="#d99a42"/><circle cx="620" cy="270" r="12" fill="#d99a42"/>

</svg>