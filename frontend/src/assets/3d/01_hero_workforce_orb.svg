<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Hero Workforce Orb</title>
  <defs>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee7fb"/>
      <stop offset="100%" stop-color="#b99bd5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c5ee"/>
      <stop offset="100%" stop-color="#80609e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a6"/>
      <stop offset="45%" stop-color="#d99a42"/>
      <stop offset="100%" stop-color="#8d5423"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="800" height="800" fill="none"/>
  
  <circle cx="400" cy="390" r="260" fill="url(#glow)" filter="url(#blur)"/>
  <g stroke="#d7a65c" stroke-width="4" opacity=".8" fill="none">
    <path d="M400 390 L210 220 M400 390 L590 220 M400 390 L190 570 M400 390 L610 570 M400 390 L400 130"/>
  </g>
  <g fill="url(#purple)" stroke="#f2eaff" stroke-width="5" filter="url(#shadow)">
    <g transform="translate(175 170)"><circle cx="35" cy="20" r="28"/><rect x="5" y="52" width="60" height="90" rx="30"/></g>
    <g transform="translate(555 170)"><circle cx="35" cy="20" r="28"/><rect x="5" y="52" width="60" height="90" rx="30"/></g>
    <g transform="translate(155 520)"><circle cx="35" cy="20" r="28"/><rect x="5" y="52" width="60" height="90" rx="30"/></g>
    <g transform="translate(575 520)"><circle cx="35" cy="20" r="28"/><rect x="5" y="52" width="60" height="90" rx="30"/></g>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="440" rx="105" ry="38" fill="url(#purple)" opacity=".8"/>
    <circle cx="400" cy="365" r="74" fill="url(#gold)" stroke="#fff1c8" stroke-width="6"/>
    <circle cx="375" cy="340" r="18" fill="#fff8dc" opacity=".7"/>
  </g>
  <circle cx="400" cy="390" r="10" fill="#fff4c5"/>

</svg>