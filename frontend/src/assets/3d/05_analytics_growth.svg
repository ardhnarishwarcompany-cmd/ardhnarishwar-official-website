<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Analytics Growth</title>
  <defs>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee7fb"/>
      <stop offset="100%" stop-color="#b99bd5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c5ee"/>
      <stop offset="100%" stop-color="#80609e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a6"/>
      <stop offset="45%" stop-color="#d99a42"/>
      <stop offset="100%" stop-color="#8d5423"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="800" height="800" fill="none"/>
  
  <ellipse cx="400" cy="650" rx="230" ry="35" fill="#80609e" opacity=".2"/>
  <g filter="url(#shadow)">
    <rect x="170" y="270" width="460" height="300" rx="32" fill="url(#purple)" stroke="#f4eaff" stroke-width="6"/>
    <path d="M235 480 L325 405 L390 445 L500 330 L570 375" fill="none" stroke="#ffe0a0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M235 500 H570 M235 500 V330" stroke="#f4eaff" stroke-width="5" opacity=".65"/>
    <circle cx="500" cy="330" r="18" fill="#ffe0a0"/>
  </g>
  <path d="M565 230 L610 185 L655 230" fill="none" stroke="#d99a42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

</svg>