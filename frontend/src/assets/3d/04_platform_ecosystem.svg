<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Platform Ecosystem</title>
  <defs>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee7fb"/>
      <stop offset="100%" stop-color="#b99bd5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c5ee"/>
      <stop offset="100%" stop-color="#80609e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a6"/>
      <stop offset="45%" stop-color="#d99a42"/>
      <stop offset="100%" stop-color="#8d5423"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="800" height="800" fill="none"/>
  
  <circle cx="400" cy="390" r="190" fill="url(#glow)" filter="url(#blur)"/>
  <g stroke="#d99a42" stroke-width="4" fill="none" opacity=".8">
    <path d="M400 390 L190 190 M400 390 L610 190 M400 390 L170 590 M400 390 L630 590"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="400" cy="390" r="95" fill="url(#gold)" stroke="#fff0bd" stroke-width="6"/>
    <rect x="110" y="110" width="150" height="110" rx="24" fill="url(#purple)" stroke="#f4eaff" stroke-width="5"/>
    <rect x="540" y="110" width="150" height="110" rx="24" fill="url(#purple)" stroke="#f4eaff" stroke-width="5"/>
    <rect x="90" y="535" width="170" height="110" rx="24" fill="url(#purple)" stroke="#f4eaff" stroke-width="5"/>
    <rect x="540" y="535" width="170" height="110" rx="24" fill="url(#purple)" stroke="#f4eaff" stroke-width="5"/>
  </g>
  <g fill="#fff1c8" opacity=".9">
    <circle cx="185" cy="165" r="15"/><circle cx="615" cy="165" r="15"/>
    <circle cx="175" cy="590" r="15"/><circle cx="625" cy="590" r="15"/>
  </g>

</svg>