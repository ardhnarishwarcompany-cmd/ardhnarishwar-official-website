<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Workflow Timeline</title>
  <defs>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee7fb"/>
      <stop offset="100%" stop-color="#b99bd5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c5ee"/>
      <stop offset="100%" stop-color="#80609e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a6"/>
      <stop offset="45%" stop-color="#d99a42"/>
      <stop offset="100%" stop-color="#8d5423"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="800" height="800" fill="none"/>
  
  <path d="M120 420 C250 180 350 650 480 400 S650 230 700 400" fill="none" stroke="#d99a42" stroke-width="8" stroke-linecap="round" opacity=".85"/>
  <g filter="url(#shadow)">
    <g><circle cx="120" cy="420" r="45" fill="url(#purple)" stroke="#f4eaff" stroke-width="5"/></g>
    <g><circle cx="300" cy="390" r="45" fill="url(#purple)" stroke="#f4eaff" stroke-width="5"/></g>
    <g><circle cx="480" cy="400" r="45" fill="url(#gold)" stroke="#fff0bd" stroke-width="5"/></g>
    <g><circle cx="700" cy="400" r="45" fill="url(#purple)" stroke="#f4eaff" stroke-width="5"/></g>
  </g>
  <g fill="#fff0bd">
    <circle cx="120" cy="420" r="12"/><circle cx="300" cy="390" r="12"/><circle cx="480" cy="400" r="12"/><circle cx="700" cy="400" r="12"/>
  </g>

</svg>